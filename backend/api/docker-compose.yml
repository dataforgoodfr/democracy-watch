
services:
  postgres:
    profiles: ["local-db"]
    image: postgres:18.6-alpine
    container_name: democracy_watch_postgres
    environment:
      POSTGRES_USER: $PGUSER
      POSTGRES_PASSWORD: $PGPASSWORD
      POSTGRES_DB: $PGDATABASE
    ports:
      - ${PGPORT}:${PGPORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: democracy_watch_keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"

  meilisearch:
    image: getmeili/meilisearch:v1.15.2
    container_name: democracy_watch_meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data

  api:
    build:
      context: ../..
      dockerfile: backend/api/Dockerfile
    container_name: democracy_watch_api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      API_PASSWORD: ${API_PASSWORD:-}
      MEILI_URL: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  microcks:
    image: quay.io/microcks/microcks-uber:1.15.0-native
    environment:
      # Exemples réels (make microcks-samples) : fichiers de ~3 Mo, au-delà de la limite par défaut.
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  postgres_data:
  meili_data:
