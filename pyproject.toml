[project]
name = "democracy-watch"
version = "0.1.0"
description = "Outil de suivi du travail parlementaire pour les chargés de plaidoyer associatifs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.8",
    "duckdb>=2.0.1",
    "duckdb-engine>=0.15.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipython-sql>=0.5.0",
    "jupysql>=0.10.17",
    "lark>=1.3.1",
    "matplotlib>=3.10.0",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.3.7",
    "requests>=2.32.3",
    "cryptography>=42.0.0",
    "fastapi[standard]>=0.111.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.2.1",
    "pyjwt[crypto]>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "prek>=0.5.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "sqlacodegen>=4.0.4",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "projection"]
testpaths = ["tests", "projection", "backend/api/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "democracy_watch"]

[tool.ty.src]
include = ["backend","democracy_watch", "tests"]
