[project]
name = "democracy-watch"
version = "0.1.0"
description = "Outil de suivi du travail parlementaire pour les chargés de plaidoyer associatifs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.8",
    "duckdb>=1.1.3",
    "duckdb-engine>=0.15.0",
    "fastapi>=0.162.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipython-sql>=0.5.0",
    "jupysql>=0.10.17",
    "matplotlib>=3.10.0",
    "meilisearch>=0.43.0",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.3.6",
    "requests>=2.32.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Query(...) en valeur par défaut est l'usage FastAPI (B008).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["democracy_watch", "backend"]

[tool.ty.src]
include = ["democracy_watch", "backend", "tests"]
