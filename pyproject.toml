[project]
name = "democracy-watch"
version = "0.1.0"
description = "Outil de suivi du travail parlementaire pour les chargés de plaidoyer associatifs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncer>=0.0.18",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "fastapi[standard]>=0.111.0",
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.2.1",
    "pyjwt[crypto]>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "prek>=0.5.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "sqlacodegen>=4.0.4",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "backend/api/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "democracy_watch"]

[tool.ty.src]
include = ["backend","democracy_watch", "tests"]
