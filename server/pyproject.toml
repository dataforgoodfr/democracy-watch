[project]
name = "democracy-watch-server"
version = "0.1.0"
description = "Scripts et services Python de Democracy Watch (données, base Postgres)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "duckdb>=1.1.3",
    "duckdb-engine>=0.15.0",
    "fastapi>=0.162.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipython-sql>=0.5.0",
    "jupysql>=0.10.17",
    "matplotlib>=3.10.0",
    "meilisearch>=0.43.0",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.3.6",
    "requests>=2.32.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
