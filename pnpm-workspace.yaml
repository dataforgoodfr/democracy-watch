packages:
  - packages/*
  - sites/*

# Versions partagées par tous les packages (`"react": "catalog:"`).
catalog:
  "@mantine/core": 8.3.18
  "@mantine/hooks": 8.3.18
  "@tabler/icons-react": 3.49.0
  "@tanstack/react-query": 5.104.5
  zustand: 5.0.16
  "@testing-library/jest-dom": 6.10.0
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@types/node": 22.20.5
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  happy-dom: 20.14.6
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 5.9.3

allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
  "@parcel/watcher": false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.3"
  - "@biomejs/cli-android-arm64@2.6.3"
  - "@biomejs/cli-android-x64@2.6.3"
  - "@biomejs/cli-darwin-arm64@2.6.3"
  - "@biomejs/cli-darwin-x64@2.6.3"
  - "@biomejs/cli-linux-arm64-musl@2.6.3"
  - "@biomejs/cli-linux-arm64@2.6.3"
  - "@biomejs/cli-linux-x64-musl@2.6.3"
  - "@biomejs/cli-linux-x64@2.6.3"
  - "@biomejs/cli-win32-arm64@2.6.3"
  - "@biomejs/cli-win32-x64@2.6.3"
