# Zudoku pré-rend chaque page en fichier .html « à plat » :
#   /03-architecture/pages → /03-architecture/pages.html
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Fichiers versionnés par le build : cache long.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/markdown;
}
